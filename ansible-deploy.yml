---
- name: Build CampusConnect Docker image
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build CampusConnect Docker image
      ansible.builtin.command:
        cmd: docker build -t campusconnect:1.0 .
      register: docker_build

    - name: Display Docker build result
      ansible.builtin.debug:
        var: docker_build.stdout_lines
